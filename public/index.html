<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAHUL-AI - WhatsApp Pairing Code</title>
    <!-- Orbitron Font for Cyber-Neon Vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05050a;
            --card-bg: rgba(10, 10, 20, 0.85);
            --text-color: #ffffff;
            --accent-red: #ff0055;
            --accent-blue: #00e5ff;
        }

        .light-mode {
            --bg-color: #f0f2f5;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-color: #111111;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Dark Mode Toggle Button */
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: 2px solid var(--accent-blue);
            color: var(--text-color);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
            z-index: 10;
        }
        .theme-toggle:hover {
            background: var(--accent-blue);
            color: #000;
        }

        /* LED Edge Animation Container */
        .neon-border-box {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 4px;
            border-radius: 20px;
            background: linear-gradient(45deg, var(--accent-red), var(--accent-blue), var(--accent-red));
            background-size: 300% 300%;
            animation: ledBorderGlow 4s linear infinite;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.4), 0 0 25px rgba(0, 229, 255, 0.4);
        }

        @keyframes ledBorderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 30px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 24px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, var(--accent-red), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        p.subtitle {
            font-size: 13px;
            opacity: 0.8;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-blue);
            display: block;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid rgba(0, 229, 255, 0.3);
            background: rgba(0, 0, 0, 0.2);
            color: var(--text-color);
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-red);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-blue));
            color: white;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 229, 255, 0.5);
        }

        .result-box {
            margin-top: 25px;
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .code-display {
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed var(--accent-blue);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--accent-blue);
            letter-spacing: 2px;
            margin-bottom: 12px;
            word-break: break-all;
        }

        .footer {
            margin-top: 20px;
            font-size: 11px;
            opacity: 0.6;
            font-family: 'Orbitron', sans-serif;
        }
    </style>
</head>
<body>

    <!-- Dark/Light Mode Toggle Button -->
    <button class="theme-toggle" onclick="toggleTheme()">⚡ Theme</button>

    <div class="neon-border-box">
        <div class="card">
            <h2>RAHUL-AI PAIR</h2>
            <p class="subtitle">Generate your WhatsApp Multi-Device Pairing Code instantly.</p>
            
            <div class="input-group">
                <label for="phone">WhatsApp Number</label>
                <input type="text" id="phone" value="919356730236" placeholder="Enter number with country code">
            </div>

            <button class="btn" onclick="generateCode()" id="genBtn">Get Pairing Code</button>

            <div class="result-box" id="resultBox">
                <label>Your Pairing Code:</label>
                <div class="code-display" id="codeDisplay">---</div>
                <button class="btn" style="background: linear-gradient(135deg, #00b09b, #96c93d);" onclick="copyCode()">Copy Code</button>
            </div>

            <div class="footer">POWERED BY RAHUL MASTER</div>
        </div>
    </div>

    <script>
        // Dark / Light Mode Toggle Function
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }

        // Generate Code Action connected to Backend API
        async function generateCode() {
            const phoneInput = document.getElementById('phone').value.trim();
            if(!phoneInput) {
                alert('Krupaya WhatsApp number taka!');
                return;
            }

            const resultBox = document.getElementById('resultBox');
            const codeDisplay = document.getElementById('codeDisplay');
            const genBtn = document.getElementById('genBtn');

            resultBox.style.display = 'block';
            codeDisplay.innerText = 'GENERATING...';
            genBtn.disabled = true;
            genBtn.style.opacity = '0.6';

            try {
                // Jar Vercel var api/ folder use karat asal tar URL `/api/code?phone=` asel
                const response = await fetch(`/api/code?phone=${encodeURIComponent(phoneInput)}`);
                const data = await response.json();

                if (data.code) {
                    codeDisplay.innerText = data.code;
                } else if (data.error) {
                    codeDisplay.innerText = 'ERROR: ' + data.error;
                } else {
                    codeDisplay.innerText = 'FAILED TO GET CODE';
                }
            } catch (err) {
                console.error(err);
                codeDisplay.innerText = 'SERVER ERROR!';
            } finally {
                genBtn.disabled = false;
                genBtn.style.opacity = '1';
            }
        }

        // Copy Code Function with Animation
        function copyCode() {
            const codeText = document.getElementById('codeDisplay').innerText;
            if(codeText === 'GENERATING...' || codeText.includes('ERROR') || codeText === '---') {
                alert('Copy karnyasathi valid code nahi ahe!');
                return;
            }
            navigator.clipboard.writeText(codeText).then(() => {
                alert('Pairing Code successfully clipboard var copy zala! 📋');
            });
        }
    </script>
</body>
</html>
